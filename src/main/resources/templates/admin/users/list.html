<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Users', ~{::content})}">
<body>
<th:block th:fragment="content">

  <p class="text-muted">
    Users are identified by their JWT <code>sub</code> claim.
    Enter a Keycloak username or subject UUID to open their role-assignment page.
  </p>

  <form th:action="@{/admin/users/search}" method="get" class="mb-4">
    <div class="input-group" style="max-width: 480px;">
      <input type="text" name="subject" class="form-control"
             placeholder="Username or subject UUID" required
             aria-label="User subject">
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-search me-1"></i> Look up
      </button>
    </div>
  </form>

  <div th:if="${not #maps.isEmpty(userRoles)}" class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>JWT Subject</th>
            <th>Roles</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="entry : ${userRoles}">
            <td><code th:text="${entry.key}"></code></td>
            <td>
              <span th:each="role : ${entry.value}"
                    class="badge bg-secondary me-1"
                    th:text="${role}"></span>
            </td>
            <td class="text-end">
              <a th:href="@{/admin/users/{userId}/roles(userId=${entry.key})}"
                 class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil me-1"></i> Edit roles
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <p th:if="${#maps.isEmpty(userRoles)}" class="text-muted fst-italic mt-2">
    No DB role assignments yet. Use the form above to manage any user's roles.
  </p>

</th:block>
</body>
</html>
