<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Users', ~{::content})}">
<body>
<th:block th:fragment="content">

  <p class="text-muted">
    Users are identified by their JWT <code>sub</code> claim.
    Enter a Keycloak username or subject UUID below to open their role-assignment page.
  </p>

  <form th:action="@{/admin/users/search}" method="get" class="mb-4">
    <div class="input-group" style="max-width: 480px;">
      <input type="text" name="subject" class="form-control"
             placeholder="Username or subject UUID" required
             aria-label="User subject">
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-search me-1"></i> Look up
      </button>
    </div>
  </form>

  <div th:if="${not #lists.isEmpty(subjects)}" class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>JWT Subject</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="sub : ${subjects}">
            <td>
              <i class="bi bi-person-circle me-1 text-secondary"></i>
              <code th:text="${sub}"></code>
            </td>
            <td>
              <a th:href="@{/admin/users/{userId}/roles(userId=${sub})}"
                 class="btn btn-outline-primary btn-sm">
                <i class="bi bi-person-badge me-1"></i> Roles
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <p th:if="${#lists.isEmpty(subjects)}" class="text-muted fst-italic mt-2">
    No DB role assignments yet. Use the form above to manage any user's roles.
  </p>

</th:block>
</body>
</html>
