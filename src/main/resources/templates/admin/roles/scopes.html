<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Manage Scopes', ~{::content})}">
<body>
<th:block th:fragment="content">

  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/admin/roles">Roles</a></li>
      <li class="breadcrumb-item" th:text="${role.name}"></li>
      <li class="breadcrumb-item active">Scopes</li>
    </ol>
  </nav>

  <div class="row g-4">

    <!-- Current scopes -->
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-key me-1"></i> Assigned SMART Scopes</span>
          <span class="badge bg-info text-dark" th:text="${#lists.size(scopes)}"></span>
        </div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              th:each="scope : ${scopes}">
            <div>
              <code class="scope-badge" th:text="${scope.scopeString}"></code>
              <small class="text-muted ms-2" th:text="${scope.description}"></small>
            </div>
            <form th:action="@{/admin/roles/{id}/scopes/{sid}/delete(id=${role.id},sid=${scope.id})}"
                  method="post">
              <button type="submit" class="btn btn-outline-danger btn-sm"
                      title="Remove scope"
                      onclick="return confirm('Remove this scope?')">
                <i class="bi bi-x-lg"></i>
              </button>
            </form>
          </li>
          <li class="list-group-item text-muted text-center py-3"
              th:if="${#lists.isEmpty(scopes)}">
            No scopes assigned yet.
          </li>
        </ul>
      </div>
    </div>

    <!-- Add new scope -->
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header"><i class="bi bi-plus-circle me-1"></i> Add SMART Scope</div>
        <div class="card-body">

          <form th:action="@{/admin/roles/{id}/scopes(id=${role.id})}"
                th:object="${newScope}" method="post">

            <div class="mb-2">
              <label class="form-label fw-semibold small">Scope string <span class="text-danger">*</span></label>
              <input type="text" th:field="*{scopeString}" class="form-control form-control-sm font-monospace"
                     placeholder="user/Patient.read" autocomplete="off"/>
              <div class="form-text">
                Format: <code>&lt;context&gt;/&lt;Resource&gt;.&lt;perms&gt;</code><br/>
                Context: <code>patient</code> | <code>user</code> | <code>system</code><br/>
                Perms: <code>read</code> | <code>write</code> | <code>cruds</code> (any combo)
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small">Description (optional)</label>
              <input type="text" th:field="*{description}" class="form-control form-control-sm"
                     placeholder="Short description"/>
            </div>

            <!-- Quick-pick buttons -->
            <div class="mb-3">
              <div class="form-text mb-1">Quick picks:</div>
              <div class="d-flex flex-wrap gap-1">
                <button type="button" class="btn btn-outline-secondary btn-sm scope-badge"
                        onclick="document.getElementById('scopeString').value='patient/Patient.read'">
                  patient/Patient.read
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm scope-badge"
                        onclick="document.getElementById('scopeString').value='user/Observation.cruds'">
                  user/Observation.cruds
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm scope-badge"
                        onclick="document.getElementById('scopeString').value='system/*.read'">
                  system/*.read
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-sm w-100">
              <i class="bi bi-plus me-1"></i> Add Scope
            </button>

          </form>
        </div>
      </div>
    </div>

  </div>

</th:block>
</body>
</html>
