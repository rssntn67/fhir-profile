<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Create Role', ~{::content})}">
<body>
<th:block th:fragment="content">

  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/admin/roles">Roles</a></li>
      <li class="breadcrumb-item active">New Role</li>
    </ol>
  </nav>

  <div class="card shadow-sm" style="max-width:600px">
    <div class="card-body">
      <form th:action="@{/admin/roles}" th:object="${roleDto}" method="post" novalidate class="needs-validation">

        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Role Name <span class="text-danger">*</span></label>
          <input type="text" id="name" th:field="*{name}" class="form-control text-uppercase"
                 placeholder="e.g. RADIOLOGIST" autocomplete="off"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
          <div class="form-text">Uppercase letters, digits and underscores only.</div>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label fw-semibold">Description</label>
          <textarea id="description" th:field="*{description}" class="form-control" rows="2"
                    placeholder="What this role is for"
                    th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
          <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="mb-4">
          <label for="smartContext" class="form-label fw-semibold">Dominant SMART Context</label>
          <select id="smartContext" th:field="*{smartContext}" class="form-select">
            <option value="">— Select —</option>
            <option th:each="ctx : ${contexts}" th:value="${ctx}" th:text="${ctx}"></option>
          </select>
          <div class="form-text">Informational: the actual access is determined by the scopes assigned below.</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Create Role</button>
          <a href="/admin/roles" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </div>

</th:block>
</body>
</html>
