<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} + ' — FHIR RBAC Admin'">FHIR RBAC Admin</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"/>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand span { font-weight: 700; color: #0d6efd; }
    .sidebar { min-height: calc(100vh - 56px); background: #fff; border-right: 1px solid #dee2e6; }
    .sidebar .nav-link { color: #495057; }
    .sidebar .nav-link.active, .sidebar .nav-link:hover { color: #0d6efd; background-color: #e7f1ff; border-radius: .375rem; }
    .badge-builtin { font-size: .7rem; }
    .scope-badge { font-family: monospace; font-size: .8rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin/roles">
      <i class="bi bi-shield-lock-fill me-1"></i>
      <span>FHIR</span> RBAC Admin
    </a>
    <div class="ms-auto d-flex align-items-center text-white small">
      <i class="bi bi-person-circle me-1"></i>
      <span sec:authentication="name">User</span>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <nav class="col-md-2 sidebar py-3 ps-3 pe-2">
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/roles') ? 'active' : ''}"
             href="/admin/roles">
            <i class="bi bi-person-badge me-1"></i> Roles
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/users') ? 'active' : ''}"
             href="/admin/users">
            <i class="bi bi-people me-1"></i> Users
          </a>
        </li>
        <li class="nav-item mt-3">
          <a class="nav-link text-secondary" href="/swagger-ui.html" target="_blank">
            <i class="bi bi-code-slash me-1"></i> REST API
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-secondary" href="/fhir/metadata" target="_blank">
            <i class="bi bi-file-earmark-medical me-1"></i> FHIR Metadata
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main content -->
    <main class="col-md-10 py-4 px-4">

      <!-- Flash messages -->
      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- Page title -->
      <h4 class="mb-4" th:text="${title}"></h4>

      <!-- Injected content -->
      <th:block th:replace="${content}"/>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmGhkpHGqV2v5WG0dQm8/Y0EuQz"
        crossorigin="anonymous"></script>
</body>
</html>
