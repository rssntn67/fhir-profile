spring:
  application:
    name: fhir-profile-server

  # HAPI FHIR JPA has a known circular dependency between searchParamRegistry and
  # inMemoryResourceMatcher. Allow Spring to resolve it via its proxy-based mechanism.
  main:
    allow-circular-references: true

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AAA_ISSUER_URI:http://localhost:8180/realms/fhir}
          jwk-set-uri: ${AAA_JWKS_URI:http://localhost:8180/realms/fhir/protocol/openid-connect/certs}
      client:
        registration:
          keycloak:
            client-id: fhir-server
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            # issuer-uri is NOT set here: it triggers eager OIDC discovery at startup
            # which fails if Keycloak is not running. Each profile provides explicit
            # endpoint URIs instead (application-dev.yml / application-prod.yml).
            user-name-attribute: preferred_username

fhir:
  rbac:
    roles-claim: ${RBAC_ROLES_CLAIM:realm_access.roles}
    scope-claim: ${RBAC_SCOPE_CLAIM:scope}
    patient-claim: ${RBAC_PATIENT_CLAIM:patient}
    patient-claim-fallback: ${RBAC_PATIENT_CLAIM_FALLBACK:launch_context.patient}
    db-roles-enabled: ${RBAC_DB_ROLES_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
